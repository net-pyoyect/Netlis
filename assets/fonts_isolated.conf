<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Aislamiento C++ de fuentes estilo Tor Browser: expone solo fuentes estándar universales
       y oculta fuentes personalizadas del sistema (ej. quantum, nerd fonts, fuentes de usuario) -->
  <dir>/usr/share/fonts/liberation</dir>
  <dir>/usr/share/fonts/noto</dir>
  <cachedir>/tmp/netlis-fontcache</cachedir>
</fontconfig>
