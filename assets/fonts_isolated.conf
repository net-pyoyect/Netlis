<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Aislamiento C++ de fuentes estilo Tor Browser: expone solo fuentes estándar universales
       y oculta fuentes personalizadas del sistema (ej. quantum, nerd fonts, fuentes de usuario) -->
  <dir>/usr/share/fonts/liberation</dir>
  <dir>/usr/share/fonts/noto</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/liberation2</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/liberation-sans</dir>
  <dir>/usr/share/fonts/liberation-serif</dir>
  <dir>/usr/share/fonts/liberation-mono</dir>
  <dir>/usr/share/fonts/google-noto</dir>
  <cachedir>/tmp/netlis-fontcache</cachedir>
</fontconfig>
